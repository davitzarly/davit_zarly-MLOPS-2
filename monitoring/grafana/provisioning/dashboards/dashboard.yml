# ====================================================================== #
# Grafana provisioning: dashboards
# ====================================================================== #
# Memberitahu Grafana untuk memuat dashboard JSON dari folder
# /var/lib/grafana/dashboards/ pada startup.
# ====================================================================== #
apiVersion: 1

providers:
  - name: NEU-DET dashboards
    orgId: 1
    folder: "NEU-DET"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
